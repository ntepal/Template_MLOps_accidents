apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  labels:
    app: airflow-webserver
spec:
  replicas: 1

  selector:
    matchLabels:
      app: airflow-scheduler

  template:
    metadata:
      labels:
        app: airflow-scheduler

    spec:
      # Comme dans le deployment de mlflow pour s'assurer des droits identiques partout
      #securityContext:
        #runAsUser: 1000
        # Le Dokcerfile le fait en root
        #runAsGroup: 0
        #fsGroup: 0

      initContainers:
        # Le conteneur airflow monte /opt/airflow/dags via un subPath du volume airflow-git-repo.
        # Or un subPath doit EXISTER au moment du montage: il est résolu une seule fois et ne suit pas les créations ultérieures.
        # Le sidecar git-sync et le conteneur Airflow démarrant en parallèle, Airflow gagne parfois la course => échec du montage :
        #   StartError / exit 128 : "no such file or directory" => RunContainerError, redémarrage, ~90 s perdues à chaque start.
        # Cet initContainer clone une fois (--one-time) puis sort : le répertoire existe donc forcément ensuite.
        # Le sidecar git-sync reste en place pour la synchronisation continue des DAGs.
        # NB : même securityContext (65533) que le sidecar, sinon le sidecar ne pourrait pas mettre à jour des fichiers créés par un autre UID.
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 65533
            runAsGroup: 65533
          args:
            - --one-time
          envFrom:
            - configMapRef:
                name: airflow-gitsync-config
          volumeMounts:
            - name: airflow-git-repo
              mountPath: /git

        - name: wait-for-postgres
          image: postgres:16.13-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U airflow; do
                echo "⏳ Waiting for postgres..."
                sleep 2
              done
              echo "✅ Postgres is ready"

      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 65533
            runAsGroup: 65533

          envFrom:
            - configMapRef:
                name: airflow-gitsync-config

          volumeMounts:
            - name: airflow-git-repo
              # Répertoire de travail du container GitSync
              mountPath: /git

        - name: scheduler
          image: docker.io/library/accidents_severity-airflow:1.0
          # Si absente alors on l'a récupère sur le docker hub
          # Evolution dans un env de prod: mettre en place le sytème
          # pour récupérer l'image
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          resources:
            # Le request réserve physiquement la mémoire
            # Le request vérifie que le CPU restant >= cpu sinon il ne démarre pas le pod
            # d'où la faible valeur car on a bcp de services
            requests:
              memory: "512Mi" # Ce qu'il demande au démarrage
              cpu: "50m"      # 0.05 vCPU
            limits:
              memory: "2Gi"   # Le plafond à ne pas dépasser
              cpu: "1000m"     # 1.0 vCPU maximum

          command: ["bash", "-c"]
          args:
            - airflow scheduler

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret

          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: CeleryExecutor
            - name: AIRFLOW_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # startupProbe: inutile car démarrage rapide

          # Vérification périodique pour savoir si le pod peut recevoir du trafic
          readinessProbe:
            # NB: HOSTNAME est fourni automatiquement
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type SchedulerJob --hostname "$AIRFLOW_HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5

          # Vérification périodique pour savoir si le pod est toujours vivant
          # Donc comme bonne pratique, remplacer la commande qui était la même que dans
          # readinessProbe par une commande qui ne fait que vérifier si le process est toujours vivant
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type SchedulerJob --hostname "$AIRFLOW_HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5

          volumeMounts:
            - name: airflow-git-repo
              mountPath: /opt/airflow/dags
              subPath: dags
            - name: airflow-git-repo
              mountPath: /opt/airflow/plugins
              subPath: plugins
            - name: logs
              mountPath: /opt/airflow/logs
              subPath: logs
            - name: params-volume
              mountPath: /opt/airflow/params.yaml
              subPath: params.yaml
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: mlflow-artifacts
              mountPath: /app/artifacts

      volumes:
        - name: airflow-git-repo
          emptyDir: {}
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-pvc-logs
        - name: params-volume
          hostPath:
            # Idéal pour le développement sur une seule VM (comportement identique à Docker Compose).
            # Attention : le fichier doit exister sur le nœud hôte avant le démarrage.
            # On monte le volume (<=> bindMounts avec docker compose) et ainsi tout devient visible et donc aussi params.yaml
            path: /home/ubuntu/Template_MLOps_accidents/
            type: Directory
          # Note : Avec hostPath, les données persistent sur le disque de la VM même si le Pod redémarre.

          # Alternative : emptyDir
          # emptyDir: {}
          # Inconvénient : Le volume est effacé à chaque fois que le Pod est recréé.
          # Nécessite un initContainer pour être repeuplé.

          # Alternative : configMap
          # configMap:
          #   name: airflow-params
          # Inconvénient : Montage en lecture seule (read-only). Impossible pour ton DAG d'écrire dedan
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
