apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Le name du Generator contient la racine fournie plus l'extension hash -xxxx
# Ainsi, dès qu'une modification est faite dans le .env.config ou .env.secret,
# comme le hash change, le/les pods concernés sot automatiquement réinitialisés
# L'inconvénient est qu'on peut seulement les utiliser dans les autres répertoires
# avec name-hash. Avec cette option, on disable le hash et ainsi on peut l'utiliser
# partour dans le projet. L'inconvénient est que si modifie le config ou secret, 
# on doit réinitialiser manuellement. Mais au moins on sait que la modification
# sera vu de tous après le reset de tous les pods
generatorOptions:
  disableNameSuffixHash: true
# NB: les xxxGenerator ne peuvent pas cohabiter avec configmap et secret
# Ils sont préférés au fichiers configmap.yaml et secret.yaml construits manuellement
# Le .env.config contient la partie du fichier .env en excluant les données sensibles
# Ls données sensibles sont mises dans .env.secret par le Makefile
configMapGenerator:
  - name: airflow-config
    options:
      disableNameSuffixHash: true
    envs:
      - ../airflow-common/.env.config

  - name: airflow-gitsync-config
    options:
      disableNameSuffixHash: true
    envs:
      - ../airflow-common/.env.config.gitsync

secretGenerator:
  - name: airflow-secret
    envs:
      - ../airflow-common/.env.secret

resources:
  - ../airflow-common/pvc.yaml
  - deployment-worker.yaml
