apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidently-monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: evidently-monitoring

  template:
    metadata:
      labels:
        app: evidently-monitoring

    spec:
      initContainers:
        - name: wait-for-evidently-ui-and-prepare
          image: busybox:1.36
          #command: ['sh', '-c', 'until nc -z evidently-ui 8000; do echo waiting for ui; sleep 2; done;']
          command:
            - sh
            - -c
            - |
              until nc -z evidently-ui 80; do echo "Attente du service UI..."; sleep 2; done;
              mkdir -p /app/data/evidently/reports
              echo "Dossier /app/data/evidently/reports créé."
              mkdir -p /app/data/evidently/accidents_severity-ws
              echo "Dossier /app/data/evidently/accidents_severity-ws."
              chown -R 1000:1000 /app/data/evidently
              echo "Droit 1000:1000 pour /app/data/evidently effectués."
          volumeMounts:
            - name: workspace
              mountPath: /app/data/evidently

      containers:
        - name: monitoring
          image: docker.io/library/accidents_severity-evidently:1.0
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          #workingDir: /app/data/evidently/accidents_severity-ws

          # Utilisation du chemin absolu complet vers le script
          command: ["/bin/sh", "-c"]
          args:
            - "python3 /app/src/monitoring/evidently_monitor_daemon.py"

          #command:
          #  - python3
          #  - src/monitoring/evidently_monitor_daemon.py

          envFrom:
            - configMapRef:
                name: evidently-config

          volumeMounts:
            - name: workspace
              mountPath: /app/data/evidently
              #mountPath: /workspace
            # Pour partager les KPIs drifts écrits pas fastapi dans le fichier data/users/fastapi_data.csv
            #- name: fastapi-users
            #  mountPath: /app/data/users
              # fastapi-pvc contient à sa racine : users/, raw/, preprocessed/, evidently/...
              # avec le CSV à users/fastapi_data.csv
              #
              # SANS subPath : monte la RACINE du PVC sur /app/data/users
              #   => le CSV se retrouve à /app/data/users/users/fastapi_data.csv (users en double)
              # AVEC subPath: users : monte le SOUS-DOSSIER users/ du PVC sur /app/data/users
              #   => le CSV est à /app/data/users/fastapi_data.csv (là où le démon le lit)
            #  subPath: users

            # En fait le daemon a besoin de users et preprocess donc autant lui donner les droits
            - name: fastapi-data
              mountPath: /app/data

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: evidently-pvc
        # On partage le même volume que fastapi
        # Inutile de le mettre dans kustomization car déjà fait dans le kustomization de fastapi
        # Et surtout important de ne pas le faire sinon on le référence 2 fois et donc conflit
        # Mais il faut s'assurer que evidently est bien lancé après fastapi
        #- name: fastapi-users
        #  persistentVolumeClaim:
        #    claimName: fastapi-pvc
        - name: fastapi-data
          persistentVolumeClaim:
            claimName: fastapi-pvc
