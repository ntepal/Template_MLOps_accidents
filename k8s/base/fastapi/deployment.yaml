apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    app: fastapi

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      # Comme dans les autres services pour uniformiser les permissions
      securityContext:
        runAsUser: 0
        #runAsGroup: 0
        fsGroup: 1000

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # On s'assure que le user 1000 a les droits sur le volume
              chown -R 1000:1000 /app/data /app/artifacts
              echo "✅ Volume nettoyé et droits fixés."
          volumeMounts:
            # IL FAUT MONTER LE VOLUME QUI CONTIENT .DVC ICI !
            - name: fastapi-data
              mountPath: /app/data
            # Si .dvc est dans data ou un autre volume, il faut le monter
            - name: artifacts
              mountPath: /app/artifacts
          #volumeMounts: [] # Pas besoin de volume, c'est dans l'image

        # Attendre MLflow (car API charge les modèles)
        - name: wait-for-mlflow
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # -T 5 pour timeout de 5s
          command:
            - sh
            - -c
            - |
              until wget -q -T 5 -O /dev/null http://mlflow/health; do
                echo "⏳ Waiting for MLflow..."
                sleep 2
              done
              echo "✅ MLflow is ready"

      containers:
        - name: fastapi
          image: docker.io/library/accidents_severity-fastapi:1.0
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          resources:
            # Le request réserve physiquement la mémoire
            # Le request vérifie que le CPU restant >= cpu sinon il ne démarre pas le pod
            # d'où la faible valeur car on a bcp de services
            requests:
              memory: "256Mi" # Ce qu'il demande au démarrage
              cpu: "50m"      # 0.05 vCPU
            limits:
              memory: "1Gi"  # Le plafond à ne pas dépasser
              cpu: "1000m"   # 1.0 vCPU maximum

          #command: ["/bin/sh", "-c", "sleep 3600"]
          # On ignore tout ce qui est dans le Dockerfile (CMD/ENTRYPOINT) ça ça génère une erreur
          command: ["python3"]
          args: ["-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "*"]
          workingDir: /app

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: fastapi-config

            - secretRef:
                name: fastapi-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            - name: fastapi-data
              mountPath: /app/data

            # volume partagé avec evidently pour l'écriture du drift dans le fichier à partager
            - name: evidently-shared
              mountPath: /app/data/evidently

            - name: artifacts
              mountPath: /app/artifacts

      volumes:
        - name: fastapi-data
          persistentVolumeClaim:
            claimName: fastapi-pvc

        - name: evidently-shared
          persistentVolumeClaim:
            claimName: evidently-pvc

        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
