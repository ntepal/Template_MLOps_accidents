# k8s/base/jobs/dvc-state/dvc-state-init.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: dvc-state-init
  namespace: accidents-severity
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: init
          # Image runner (et non busybox) : elle contient dvc, nécessaire
          # pour "dvc init --no-scm".
          image: docker.io/library/accidents_severity-runner:1.0
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              # fait échouer le Job dès la première erreur, au lieu de continuer et d'afficher un succès trompeur
              set -e
              # --- État DVC ---
              # Un subPath pointant vers un FICHIER doit exister avant le montage,
              # sinon kubelet le crée comme un RÉPERTOIRE => "Is a directory".
              #mkdir -p /state/dvc
              #touch /state/dvc.lock /state/params.yaml
              mkdir -p /state/dvc
              # Un dvc.lock VIDE échoue à la validation ("required key not provided, in schema") : DVC 3.x attend au minimum la clé schema.
              # [ -s ] teste "non vide" => on n'écrase pas un lock déjà produit par un run précédent.
              [ -s /state/dvc.lock ]   || echo "schema: '2.0'" > /state/dvc.lock
              [ -s /state/params.yaml ] || echo "TRAIN_YEAR: 2019" > /state/params.yaml
              # DVC exige un dépôt Git, absent de l'image (.git exclu par
              # .dockerignore). Aucun stage du dvc.yaml n'utilise le SCM,
              # donc --no-scm suffit.
              cd /app
              # --- dvc init initialise le dvc dans le répertoire courant (donc /app) (<=> git init pour git)
              # --- en créant .dvc/xxx, pour config, .gitignore (pour que Git ignore le cache DVC), .dvcignore
              # --no-scm : DVC fonctionne sans Git. Nécessaire ici car .git est exclu par .dockerignore
              # => l'image n'est pas un dépôt Git ("ERROR: /app is not a git repository").
              # Conséquences acceptées :
              #   - plus de "dvc checkout" pour revenir à une version via commit
              #   - dvc repro ne détecte plus les changements via le hash Git ;
              #     il s'appuie uniquement sur les hashes des fichiers listés
              #     dans les "deps" du dvc.yaml — c'est exactement ce qu'on veut.
              # Cohérent avec K8s : le code est FIGÉ dans l'image (versionnée par son tag), un pod n'a pas vocation à faire des commits.
              # -f : écrase le /app/.dvc vide créé par le Dockerfile (et permet de relancer ce Job sans erreur).
              # -q : sortie réduite (n'affiche que les erreurs et pas les infos)
              dvc init --no-scm -f -q
              cp -a /app/.dvc/. /state/dvc/
              # --- Données du pipeline ---
              # simu_data_web : source des CSV (dep du stage import)
              # models / reports : outs de train et evaluate, partagés entre pods
              mkdir -p /pipeline/simu_data_web /pipeline/models /pipeline/reports
              echo "--- /state ---"    && ls -la /state /state/dvc
              echo "--- /pipeline ---" && ls -la /pipeline
              echo "✅ volumes initialisés"
          volumeMounts:
            - name: dvc-state
              mountPath: /state
            - name: pipeline
              mountPath: /pipeline
      volumes:
        - name: dvc-state
          persistentVolumeClaim:
            claimName: dvc-state-pvc
        - name: pipeline
          persistentVolumeClaim:
            claimName: pipeline-data-pvc
