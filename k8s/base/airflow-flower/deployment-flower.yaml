apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-flower
  labels:
    app: airflow-flower

spec:
  replicas: 1

  selector:
    matchLabels:
      app: airflow-flower

  template:
    metadata:
      labels:
        app: airflow-flower

    spec:
      # Comme dans le deployment de mlflow pour s'assurer des droits identiques partout
      #securityContext:
        #runAsUser: 1000
        # Le Dokcerfile le fait en root
        #runAsGroup: 0
        #fsGroup: 0

      initContainers:
        - name: wait-for-postgres
          image: postgres:16.13-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U airflow; do
                echo "⏳ Waiting for postgres..."
                sleep 2
              done
              echo "✅ Postgres is ready"

      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 65533
            runAsGroup: 65533

          envFrom:
            - configMapRef:
                name: airflow-gitsync-config

          volumeMounts:
            - name: airflow-git-repo
              # Répertoire de travail du container GitSync
              mountPath: /git

        - name: flower
          image: docker.io/library/accidents_severity-airflow:1.0
          # Si absente alors on l'a récupère sur le docker hub
          # Evolution dans un env de prod: mettre en place le sytème
          # pour récupérer l'image
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          resources:
            requests:
              memory: "256Mi"  # Ce qu'il demande au démarrage
              cpu: "100m"      # 0.1 vCPU
            limits:
              memory: "1Gi"  # Le plafond à ne pas dépasser
              cpu: "900m"      # 0.5 vCPU maximum

          command: ["bash", "-c"]
          args:
            - airflow celery flower

          ports:
            - containerPort: 5555

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret

          env:
            - name: FLOWER_URL_PREFIX
              value: flower

          # startupProbe: inutile car démarrage rapide

          # Vérification périodique pour savoir si le pod peut recevoir du trafic
          readinessProbe:
            httpGet:
              path: /flower/
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          # Vérification périodique pour savoir si le pod est toujours vivant
          livenessProbe:
            httpGet:
              path: /flower/
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          volumeMounts:
            - name: airflow-git-repo
              # Répertoire de travail du container GitSync
              # Les volumes dags et plugins sont présent
              # grâce aux variables settées dans configmap.yaml
              mountPath: /git

      volumes:
        - name: airflow-git-repo
          # Volume via GitSync container
          emptyDir: {}

        - name: logs
          persistentVolumeClaim:
            claimName: airflow-pvc-logs
