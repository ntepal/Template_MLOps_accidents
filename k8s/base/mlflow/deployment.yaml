# On vérifie que le service renvoie bien une erreur si postgres n'a pas démarré
# Ainsi, grâce au deployement, Kubernetes redémarre automatiquement le pod
# Donc, grâce à ce mécanisme, la dépendance (docker-compose) devient inutile
# Pour tester, on lance kubectl apply -k k8s/mlflow puis kubectl get pods -n accidents-severity -w
# pour voir l'évolution temps réel. Puis sur un autre terminal, on fait 
# kubectl logs -f deployment/mlflow -n accidents-severity pour voir en temps réel
# ce qui se passe et s'assurer que ça plante car le postgres n'est pas ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      # Le securityContext définit l'identité du processus dans le conteneur
      # et les permissions d'accès au volume (fsGroup)
      # Remplace les anciens scripts (fix-permissions) de type chown dans Docker Compose
      # Les containers (docker-compose) écrivent avec les droits roots. Pour les volumes
      # partagés, cela générait des conflits de droits car des fichiers étaient root
      # Le fix-permissions permet de fixer les droit users/group dès le début et ainsi les
      # containers qui ont les droits roots ont donc les droits pour écrire dans des répertoires
      # de droits users/groups et donc ne les modifient pas
      # Avec securityContext, on fixe lses droits runAsUser / runAsGroup et donc ils tournent
      # directement en UID cohérents
      # Avec le fsgroup: le volume monté est automatiquement accessible au groupe 1000
      # Kubernetes ajuste les permissions au montage
      securityContext:
        runAsUser: 0
        #runAsGroup: 1000
        fsGroup: 1000

      initContainers:
        - name: wait-for-postgres
          image: postgres:16.13-trixie
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U airflow; do
                echo "⏳ Waiting for postgres..."
                sleep 2
              done
              echo "✅ Postgres is ready"

        #- name: fix-dvc-permissions
        #  image: busybox:1.36
        #  command: ["sh", "-c", "mkdir -p /app/.dvc/tmp && chmod -R 777 /app/.dvc"]

      containers:
        - name: mlflow
          image: docker.io/library/accidents_severity-mlflow:1.0
          # Si absente alors on l'a récupère sur le docker hub
          # Evolution dans un env de prod: mettre en place le sytème
          # pour récupérer l'image
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          resources:
            # Le request réserve physiquement la mémoire
            # Le request vérifie que le CPU restant >= cpu sinon il ne démarre pas le pod
            # d'où la faible valeur car on a bcp de services
            requests:
              memory: "512Mi" # Ce qu'il demande au démarrage
              cpu: "50m"      # 0.05 vCPU
            limits:
              memory: "2Gi"   # Le plafond à ne pas dépasser
              cpu: "1000m"    # 1.0 vCPU maximum

          ports:
            - containerPort: 5000

          # C'est fait dans l'image dockerfile mais apparemment ce n'est pas suffisant je dois le faire ici
          # --static-prefix /mlflow : ainsi MLflow génère et attend /mlflow/... partout; donc côté ingress retirer rewrite-target
          # mais ça génère des 404 lors des échanges et potentiel pb donc on l'enlève
          command: ["/bin/sh", "-c"]
          args:
            - |
              rm -rf /app/.dvc /app/dvc.yaml /app/dvc.lock
              chown -R 1000:1000 /app/artifacts
              mlflow server --host 0.0.0.0 --port 5000 \
                --backend-store-uri ${DATABASE_URL} \
                --default-artifact-root /app/artifacts \
                --workers 1 \
                --allowed-hosts '*' --cors-allowed-origins '*'

          env:
            # ---------------------------------------------------------------------------
            # MLFLOW_SERVER_ENABLE_JOB_EXECUTION = false
            # ---------------------------------------------------------------------------
            # MLflow 3.x embarque un "job runner" (file de tâches Huey) activé par défaut.
            # Au démarrage, il lance UN PROCESS PYTHON PAR QUEUE (+ 1 pour les tâches
            # périodiques), soit ~7 process de ~220 Mo chacun => ~1,5 Go de RAM.
            # Constaté ici : 1,65 Go consommés dont seulement ~230 Mo pour le serveur web.
            # => OOMKilled (exit 137) sur la limite de 2 Gi du conteneur.
            #
            # Ces jobs servent aux opérations asynchrones déclenchées depuis l'UI/API :
            # évaluation de modèles, scorers/judges GenAI, scoring en ligne, maintenance.
            # Dans NOTRE architecture, l'entraînement et l'évaluation tournent dans le
            # conteneur "runner" via les DAGs Airflow. Ce serveur ne fait que servir l'UI
            # et lire/écrire dans Postgres : les consumers tournent donc à vide.
            #
            # ⚠️ Conséquence : une tâche asynchrone lancée depuis l'UI resterait en attente
            # SANS message d'erreur explicite. Repasser à "true" (+ restart du pod) si on
            # utilise un jour l'évaluation côté serveur ou les fonctions GenAI.
            #
            # Réf : mlflow/environment_variables.py L1437 (défaut = True)
            #       mlflow/server/jobs/_job_runner.py (1 consumer par queue)
            # Gain mesuré : ~1,65 Go -> ~500 Mo, démarrage plus rapide (-10 s de sleep)
            # ---------------------------------------------------------------------------
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            - name: MLFLOW_HTTP_REQUEST_TIMEOUT
              value: "60"
            - name: DATABASE_URL
              value: postgresql://airflow:airflow@postgres:5432/mlflow

          startupProbe:
            httpGet:
              # Comme on n'a plus le --static-prefix /mlflow, on doit donc modifier
              path: /
              #path: /mlflow
              port: 5000
            periodSeconds: 30
            failureThreshold: 20   # 500s max

          readinessProbe:
            httpGet:
              path: /
              #path: /mlflow
              port: 5000
            periodSeconds: 40
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              #path: /mlflow
              port: 5000
            periodSeconds: 60
            # Prendre en compte les lenteurs
            failureThreshold: 5

          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /app/artifacts

      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-pvc
