apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-worker
  labels:
    app: airflow-worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: airflow-worker

  template:
    metadata:
      labels:
        app: airflow-worker

    spec:
      # Comme dans le deployment de mlflow pour s'assurer des droits identiques partout
      #securityContext:
        #runAsUser: 1000
         # Le Dokcerfile le fait en root
        #runAsGroup: 0
        #fsGroup: 0

      initContainers:
        - name: wait-for-postgres
          image: postgres:16.13-trixie
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U airflow; do
                echo "⏳ Waiting for postgres..."
                sleep 2
              done
              echo "✅ Postgres is ready"

      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.1.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: airflow-gitsync-config

          volumeMounts:
            - name: airflow-git-repo
              # Répertoire de travail du container GitSync
              mountPath: /git

        - name: worker
          image: docker.io/library/accidents_severity-airflow:1.0
          # Si absente alors on l'a récupère sur le docker hub
          # Evolution dans un env de prod: mettre en place le sytème
          # pour récupérer l'image
          #imagePullPolicy: IfNotPresent
          # Configuration pour forcer l'utilisation de l'image locale
          imagePullPolicy: Never

          command: ["bash", "-c"]
          args:
            - |
              # On utilise le chemin complet vers l'exécutable celery trouvé dans le conteneur
              # On définit le nom du worker dynamiquement
              exec /app/.venv/bin/celery --app airflow.providers.celery.executors.celery_executor.app worker --hostname="worker@$HOSTNAME" --loglevel=info
          #  - sleep 3600
          #  - airflow celery worker

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret

          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: CeleryExecutor
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Cette variable force le nom du worker Celery
            - name: CELERY_WORKER_NAME
              value: "worker@$HOSTNAME"

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /app/.venv/bin/celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "worker@$HOSTNAME"
                #- celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$AIRFLOW_HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5

          # Vérification périodique pour savoir si le pod est toujours vivant
          # Donc comme bonne pratique, vérifier si le process est toujours vivant
          # pgrep n'est pas supporté
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /app/.venv/bin/celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "worker@$HOSTNAME"
                #- celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$AIRFLOW_HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5

          volumeMounts:
            - name: airflow-git-repo
              # Répertoire de travail du container GitSync
              # Les volumes dags et plugins sont présent
              # grâce aux variables settées dans configmap.yaml
              mountPath: /git

            - name: logs
              mountPath: /app/logs

      volumes:
        - name: airflow-git-repo
          # Volume via GitSync container
          emptyDir: {}

        - name: logs
          persistentVolumeClaim:
            claimName: airflow-pvc-logs
