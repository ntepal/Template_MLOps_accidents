apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  labels:
    app: airflow
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600

  template:
    spec:
      # Comme dans le deployment de mlflow pour s'assurer des droits identiques partout
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      restartPolicy: OnFailure

      initContainers:
        # On ne met pas -U airflow dans le until car il n'est pas encore créé
        # C'est justement le init-job qui le crée
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "⏳ Waiting for postgres..."
                sleep 2
              done
              echo "✅ Postgres is ready"

      containers:
        - name: airflow-init
          image: accidents_severity-airflow:1.0

          command: ["bash", "-c"]
          args:
            # | = construire 1 seule chaîne de caractères multi-lignes,
            # en conservant exactement les retours à la ligne”
            # Ainsi, bash -c reçoit cette chaine et bash l’interprète comme du code
            - |
              # Le script s'arrête si erreur
              set -e

              echo "⚙️ Running Airflow migrations..."
              airflow db migrate

              echo "🚀 Creating admin user (if not exists)..."
              # Cherche si l'utilisateur (w: match uniquement le mot exact) existe déjà dans la liste
              if ! airflow users list | grep -qw "$AIRFLOW_WWW_USER_USERNAME"; then
                airflow users create \
                  --username "$AIRFLOW_WWW_USER_USERNAME" \
                  --password "$AIRFLOW_WWW_USER_PASSWORD" \
                  --firstname Admin \
                  --lastname User \
                  --role Admin \
                  --email admin@example.com
              else
                echo "User already exists"
              fi
              echo "✅ Airflow init completed"

          env:
            - name: AIRFLOW_WWW_USER_USERNAME
              value: admin
            - name: AIRFLOW_WWW_USER_PASSWORD
              value: admin

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-secret
